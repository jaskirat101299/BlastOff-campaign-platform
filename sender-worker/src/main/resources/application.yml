spring:
  application:
    name: sender-worker
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sender-workers
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.blastoff.sender_worker.messaging.CampaignMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.blastoff.sender_worker.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

app:
  topics:
    campaign-messages: campaign-messages
    campaign-messages-dlt: campaign-messages.DLT
    message-results: message-results
  send-delay-ms: 100
  mock:
    transient-failure-rate: 0.15
    permanent-failure-percent: 2
  retry:
    max-attempts: 3
    initial-interval-ms: 500
    multiplier: 2.0