server:
  port: 8083

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:h2:mem:reporting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.blastoff.reporting_service.messaging.MessageResult
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.blastoff.reporting_service.messaging

app:
  topics:
    message-results: message-results